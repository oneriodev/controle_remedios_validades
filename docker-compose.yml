# Banco de dados do MVP de validades farmacêuticas.
# As credenciais vêm do arquivo .env (que NÃO é versionado).
services:
  db:
    image: postgres:18-alpine          # "alpine" = imagem menor e mais enxuta
    container_name: controle_validades_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"   # acessível só a partir desta máquina
    volumes:
      - pgdata:/var/lib/postgresql          # dados persistem fora do contêiner
    healthcheck:                            # o Docker testa se o banco aceita conexões
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: